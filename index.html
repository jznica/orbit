<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Orbit — Where minds find each other</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='none' stroke='%23C9A961' stroke-width='1.4'/%3E%3Ccircle cx='12' cy='12' r='1.6' fill='%23C9A961'/%3E%3Ccircle cx='18.5' cy='5.5' r='2.2' fill='%23E8B547'/%3E%3Ccircle cx='5' cy='17' r='0.8' fill='%23C9A961' opacity='0.5'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230F1424'/%3E%3Ccircle cx='12' cy='12' r='9' fill='none' stroke='%23C9A961' stroke-width='1.4'/%3E%3Ccircle cx='12' cy='12' r='1.6' fill='%23C9A961'/%3E%3Ccircle cx='18.5' cy='5.5' r='2.2' fill='%23E8B547'/%3E%3Ccircle cx='5' cy='17' r='0.8' fill='%23C9A961' opacity='0.5'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Crimson+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --navy: #0F1424; --navy-deep: #080B16; --navy-light: #1A2038; --navy-card: #161B30;
  --gold: #C9A961; --gold-bright: #E8B547;
  --gold-soft: rgba(201, 169, 97, 0.4); --gold-faint: rgba(201, 169, 97, 0.15);
  --cream: #F4E8D0; --burgundy: #6B1F2A; --burgundy-light: #8B2A38;
  --moonlight: #F8F4EC;
  --moonlight-muted: rgba(248, 244, 236, 0.65);
  --moonlight-faint: rgba(248, 244, 236, 0.35);
  --amber: #E8B547; --candle: rgba(232, 181, 71, 0.12);
  --font-display: 'Cormorant Garamond', serif;
  --font-body: 'Crimson Pro', serif;
  --font-ui: 'Manrope', sans-serif;
  --transition: cubic-bezier(0.4, 0.0, 0.2, 1);
  --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--navy); color: var(--moonlight);
  font-family: var(--font-body);
  min-height: 100vh; overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  transition: filter 600ms var(--transition);
}
body.lumos { filter: brightness(1.35) saturate(1.15); }
body.lumos::after {
  content: ''; position: fixed; inset: 0;
  background: radial-gradient(ellipse at center, rgba(232, 181, 71, 0.15) 0%, transparent 60%);
  pointer-events: none; z-index: 999; animation: fadeIn 400ms ease;
}
.constellation { position: fixed; inset: 0; pointer-events: none; opacity: 0.5; z-index: 0; }
.candlelight {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 60% 40% at 50% 100%, var(--candle), transparent 70%),
    radial-gradient(ellipse 40% 50% at 0% 100%, rgba(232, 181, 71, 0.06), transparent 60%),
    radial-gradient(ellipse 40% 50% at 100% 0%, rgba(107, 31, 42, 0.08), transparent 60%);
}
.dust { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
.dust span {
  position: absolute; bottom: -20px; width: 3px; height: 3px;
  background: var(--gold); border-radius: 50%; opacity: 0;
  animation: floatUp linear infinite;
  box-shadow: 0 0 6px var(--gold-bright);
}
@keyframes floatUp {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  10% { opacity: 0.6; } 90% { opacity: 0.4; }
  100% { transform: translateY(-110vh) translateX(60px); opacity: 0; }
}
#app {
  position: relative; z-index: 2;
  max-width: 480px; margin: 0 auto; overflow: hidden;
  height: 100vh; height: 100dvh;
  display: flex; flex-direction: column;
}
@media (min-width: 768px) {
  #app {
    max-width: 440px; margin: 24px auto; border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px var(--gold-faint);
    height: calc(100vh - 48px); max-height: calc(100vh - 48px);
  }
}
.screen { flex: 1; min-height: 0; padding: 0; overflow-y: auto; overflow-x: hidden; animation: slideInFade 500ms var(--transition) both; }
@keyframes slideInFade { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeInSlow { from { opacity: 0; } to { opacity: 1; } }
@keyframes inkDraw { from { stroke-dashoffset: 1000; opacity: 0; } to { stroke-dashoffset: 0; opacity: 1; } }
@keyframes candleFlicker {
  0%, 100% { opacity: 0.9; filter: brightness(1); }
  50% { opacity: 1.0; filter: brightness(1.05); }
  70% { opacity: 0.92; filter: brightness(0.98); }
}
@keyframes amberPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(232, 181, 71, 0); }
  50% { box-shadow: 0 0 0 12px rgba(232, 181, 71, 0.06); }
}
@keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes orbit-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes pop {
  0% { transform: scale(0.5); opacity: 0; }
  60% { transform: scale(1.2); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes quillScratch {
  0% { transform: translate(-200%, 50%) rotate(-25deg); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translate(300%, -50%) rotate(-25deg); opacity: 0; }
}
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes fadeOut { to { opacity: 0; transform: translateX(-50%) translateY(-8px); } }
.toast {
  position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
  background: var(--navy-card); border: 1px solid var(--gold-soft);
  color: var(--gold); padding: 12px 24px; border-radius: 999px;
  font-family: var(--font-display); font-style: italic; font-size: 14px;
  z-index: 1000;
  animation: fadeIn 250ms var(--transition), fadeOut 400ms var(--transition) 2.6s forwards;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4), 0 0 24px rgba(232, 181, 71, 0.2);
  pointer-events: none;
}
.welcome {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh; padding: 48px 32px; text-align: center;
  position: relative;
}
@media (min-width: 768px) { .welcome { min-height: 100%; } }
.key-icon {
  width: 64px; height: 64px; margin-bottom: 40px;
  animation: candleFlicker 4s ease-in-out infinite, float 6s ease-in-out infinite;
}
.key-icon svg { width: 100%; height: 100%; stroke: var(--gold); fill: none; stroke-width: 1.2; }
.key-icon svg path { stroke-dasharray: 200; animation: inkDraw 2.5s var(--transition) both; }
.orbit-mark {
  width: 92px; height: 92px;
  margin-bottom: 32px;
  animation: candleFlicker 4s ease-in-out infinite, float 6s ease-in-out infinite;
  filter: drop-shadow(0 0 16px rgba(232, 181, 71, 0.28));
}
.orbit-mark svg {
  width: 100%; height: 100%;
  color: var(--gold-bright);
  overflow: visible;
}
.orbit-satellite {
  transform-origin: 12px 12px;
  animation: orbitSatellite 14s linear infinite;
}
@keyframes orbitSatellite {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
.welcome h1 {
  font-family: var(--font-display); font-weight: 500;
  font-size: 72px; color: var(--gold);
  letter-spacing: 0.04em; margin-bottom: 24px;
  animation: fadeInSlow 1.2s var(--transition) 0.6s both;
}
.welcome .tagline {
  font-family: var(--font-display); font-style: italic;
  font-size: 22px; color: var(--moonlight-muted);
  margin-bottom: 56px;
  animation: fadeInSlow 1.2s var(--transition) 1s both;
  min-height: 60px;
}
.welcome-actions {
  display: flex; flex-direction: column; gap: 14px;
  width: 100%; max-width: 280px;
  animation: fadeInSlow 1.2s var(--transition) 1.4s both;
}
.btn {
  font-family: var(--font-ui); font-weight: 500;
  font-size: 14px; letter-spacing: 0.15em; text-transform: uppercase;
  padding: 16px 36px;
  border: 1px solid var(--gold);
  background: transparent; color: var(--gold);
  border-radius: 999px; cursor: pointer;
  transition: all 300ms var(--transition);
  position: relative; overflow: hidden; width: 100%;
}
.btn:hover { background: var(--gold); color: var(--navy); box-shadow: 0 0 24px rgba(232, 181, 71, 0.3); }
.btn:active { transform: scale(0.98); }
.btn-filled {
  background: var(--gold); color: var(--navy); border-color: var(--gold);
  animation: amberPulse 3s ease-in-out 2s infinite;
}
.btn-filled:hover { background: var(--gold-bright); border-color: var(--gold-bright); box-shadow: 0 0 32px rgba(232, 181, 71, 0.5); }
.welcome .footer {
  position: absolute; bottom: 32px; left: 0; right: 0;
  text-align: center; color: var(--moonlight-faint);
  font-family: var(--font-display); font-style: italic;
  font-size: 13px; letter-spacing: 0.1em;
  animation: fadeInSlow 1.2s var(--transition) 2s both;
}
.welcome .footer a {
  color: var(--gold-soft); text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: all 200ms;
}
.welcome .footer a:hover { color: var(--gold); border-bottom-color: var(--gold-soft); }
.auth-screen {
  min-height: 100vh; padding: 56px 32px 48px;
  display: flex; flex-direction: column;
  animation: slideInFade 500ms var(--transition) both;
}
@media (min-width: 768px) { .auth-screen { min-height: 100%; } }
.auth-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; }
.auth-back {
  background: none; border: none; color: var(--moonlight-faint);
  font-family: var(--font-ui); font-size: 13px;
  cursor: pointer; letter-spacing: 0.08em;
  padding: 8px 0; display: flex; align-items: center; gap: 6px;
}
.auth-back:hover { color: var(--gold); }
.auth-back svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
.auth-mini-logo {
  font-family: var(--font-display); font-weight: 500;
  font-size: 22px; color: var(--gold); letter-spacing: 0.06em;
}
.auth-title {
  font-family: var(--font-display); font-weight: 500;
  font-size: 38px; color: var(--moonlight);
  line-height: 1.1; margin-bottom: 12px;
}
.auth-subtitle {
  font-family: var(--font-display); font-style: italic;
  font-size: 17px; color: var(--moonlight-muted);
  line-height: 1.5; margin-bottom: 40px;
}
.oauth-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }
.oauth-btn {
  display: flex; align-items: center; justify-content: center;
  gap: 12px; padding: 14px 20px;
  border-radius: 12px; border: 1px solid var(--gold-soft);
  font-family: var(--font-ui); font-weight: 600; font-size: 14px;
  letter-spacing: 0.02em; cursor: pointer;
  transition: all 250ms var(--transition); width: 100%;
}
.oauth-btn.google {
  background: #FFFFFF; color: #1F1F1F;
  border-color: rgba(201, 169, 97, 0.5);
}
.oauth-btn.google:hover { background: #F8F8F8; border-color: var(--gold); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3); }
.oauth-btn.apple {
  background: #000000; color: #FFFFFF;
  border-color: rgba(201, 169, 97, 0.5);
}
.oauth-btn.apple:hover { background: #1A1A1A; border-color: var(--gold); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
.oauth-btn svg { width: 18px; height: 18px; }
.oauth-btn .text { letter-spacing: 0.04em; }
.or-divider {
  display: flex; align-items: center; gap: 14px;
  margin: 8px 0 24px;
  font-family: var(--font-display); font-style: italic;
  color: var(--moonlight-faint); font-size: 13px;
}
.or-divider::before, .or-divider::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(to right, transparent, var(--gold-faint), transparent);
}
.email-field { margin-bottom: 28px; }
.email-field label {
  display: block; font-family: var(--font-ui);
  font-size: 11px; color: var(--moonlight-muted);
  letter-spacing: 0.12em; text-transform: uppercase;
  margin-bottom: 10px; font-weight: 600;
}
.email-input {
  width: 100%; background: transparent; border: none;
  border-bottom: 1px solid var(--gold-soft);
  padding: 14px 0; font-family: var(--font-body);
  font-size: 18px; color: var(--moonlight); outline: none;
  transition: border-bottom-color 300ms var(--transition);
}
.email-input::placeholder { color: var(--moonlight-faint); font-style: italic; }
.email-input:focus { border-bottom-color: var(--gold-bright); }
.help-text {
  font-family: var(--font-ui); font-size: 12px;
  color: var(--moonlight-faint);
  letter-spacing: 0.02em; line-height: 1.6;
}
.auth-footer-link {
  margin-top: auto; text-align: center;
  font-family: var(--font-display); font-style: italic;
  font-size: 14px; color: var(--moonlight-muted);
  padding-top: 32px;
}
.auth-footer-link a {
  color: var(--gold); text-decoration: none;
  border-bottom: 1px solid var(--gold-soft);
  padding-bottom: 1px; margin-left: 6px;
}
.auth-footer-link a:hover { border-bottom-color: var(--gold); }
.verify-screen { text-align: center; }
.verify-icon {
  width: 64px; height: 64px;
  margin: 0 auto 28px;
  background: radial-gradient(circle, rgba(232, 181, 71, 0.15), transparent 70%);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  animation: candleFlicker 3s ease-in-out infinite;
}
.verify-icon svg { width: 36px; height: 36px; stroke: var(--gold); fill: none; stroke-width: 1.3; }
.verify-email { color: var(--gold); font-weight: 500; }
.code-input-row { display: flex; gap: 10px; justify-content: center; margin: 32px 0 24px; }
.code-digit {
  width: 44px; height: 56px;
  background: rgba(201, 169, 97, 0.04);
  border: 1px solid var(--gold-soft);
  border-radius: 12px;
  font-family: var(--font-display); font-weight: 600;
  font-size: 28px; color: var(--gold);
  text-align: center; outline: none;
  transition: all 200ms var(--transition);
  -webkit-appearance: none;
}
.code-digit:focus {
  border-color: var(--gold-bright);
  background: rgba(232, 181, 71, 0.08);
  box-shadow: 0 0 0 4px rgba(232, 181, 71, 0.08);
}
.code-digit.filled { border-color: var(--gold); animation: pop 300ms var(--transition-bounce); }
@media (max-width: 380px) {
  .code-digit { width: 38px; height: 50px; font-size: 22px; }
  .code-input-row { gap: 6px; }
}
.resend-row {
  font-family: var(--font-display); font-style: italic;
  font-size: 13px; color: var(--moonlight-faint);
  line-height: 1.8;
}
.resend-row .link {
  color: var(--gold); cursor: pointer; text-decoration: none;
  background: none; border: none; font: inherit;
  padding: 0; margin: 0;
  border-bottom: 1px solid var(--gold-soft);
}
.resend-row .link:disabled { color: var(--moonlight-faint); cursor: default; border-bottom-color: transparent; }
.resend-row .link:hover:not(:disabled) { color: var(--gold-bright); }
.auth-action-btn {
  width: 100%; padding: 16px;
  font-family: var(--font-ui); font-weight: 600; font-size: 13px;
  letter-spacing: 0.15em; text-transform: uppercase;
  background: var(--gold); color: var(--navy);
  border: none; border-radius: 999px;
  cursor: pointer; margin-top: 12px;
  transition: all 250ms var(--transition);
}
.auth-action-btn:hover { background: var(--gold-bright); box-shadow: 0 0 24px rgba(232, 181, 71, 0.4); }
.oauth-loading {
  position: fixed; inset: 0; z-index: 200;
  background: var(--navy);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 28px;
  animation: fadeIn 250ms var(--transition);
}
.oauth-loading-stage { width: 120px; height: 120px; position: relative; }
.oauth-loading-ring {
  position: absolute; inset: 0;
  border: 1px solid var(--gold-faint);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: orbit-spin 1.6s linear infinite;
}
.oauth-loading-ring.inner {
  inset: 16px;
  border-color: var(--gold-faint);
  border-right-color: var(--gold-bright);
  animation: orbit-spin 1.2s linear infinite reverse;
}
.oauth-loading-logo {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
}
.oauth-loading-logo .ico { width: 36px; height: 36px; display: inline-block; }
.oauth-loading .msg {
  font-family: var(--font-display); font-style: italic;
  font-size: 18px; color: var(--gold);
  letter-spacing: 0.04em; text-align: center;
}
.oauth-loading .sub {
  font-family: var(--font-display); font-style: italic;
  font-size: 13px; color: var(--moonlight-faint);
  margin-top: -16px;
}
.onboarding { padding: 56px 32px 48px; min-height: 100vh; display: flex; flex-direction: column; }
@media (min-width: 768px) { .onboarding { min-height: 100%; } }
.progress { display: flex; gap: 6px; justify-content: center; margin-bottom: 40px; }
.progress-dot { width: 24px; height: 2px; background: var(--gold-faint); transition: background 400ms var(--transition); }
.progress-dot.active { background: var(--gold); }
.onboarding h2 {
  font-family: var(--font-display); font-weight: 500;
  font-size: 36px; color: var(--moonlight);
  margin-bottom: 12px; line-height: 1.15;
}
.onboarding .subtitle {
  font-family: var(--font-display); font-style: italic;
  font-size: 18px; color: var(--moonlight-muted);
  margin-bottom: 40px; line-height: 1.5;
}
.interest-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 12px; flex: 1; margin-bottom: 32px;
}
.interest-tile {
  aspect-ratio: 1;
  background: rgba(201, 169, 97, 0.04);
  border: 1px solid var(--gold-soft);
  border-radius: 12px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px; cursor: pointer;
  transition: all 300ms var(--transition);
  position: relative; overflow: hidden;
}
.interest-tile:hover { border-color: var(--gold); background: rgba(201, 169, 97, 0.08); transform: translateY(-2px); }
.interest-tile.selected {
  border-color: var(--gold-bright);
  background: rgba(232, 181, 71, 0.12);
  box-shadow: inset 0 0 24px rgba(232, 181, 71, 0.1);
  animation: pop 400ms var(--transition-bounce);
}
.interest-tile svg { width: 24px; height: 24px; stroke: var(--gold); fill: none; stroke-width: 1.2; }
.interest-tile.selected svg { stroke: var(--gold-bright); }
.interest-tile span {
  font-family: var(--font-ui); font-size: 11px;
  color: var(--moonlight-muted); letter-spacing: 0.04em;
  text-align: center; line-height: 1.2;
}
.interest-tile.selected span { color: var(--moonlight); }
.onboarding-footer {
  margin-top: auto;
  display: flex; justify-content: space-between; align-items: center;
  gap: 16px; padding-top: 24px;
}
.back-btn {
  background: none; border: none;
  color: var(--moonlight-faint);
  font-family: var(--font-ui); font-size: 13px;
  cursor: pointer; letter-spacing: 0.08em;
  padding: 8px 0;
}
.back-btn:hover { color: var(--gold); }
.sigil-reveal { text-align: center; padding: 32px 0; animation: pop 800ms var(--transition-bounce); }
.sigil-reveal .sigil-circle {
  width: 120px; height: 120px;
  margin: 0 auto 32px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(232, 181, 71, 0.2), transparent 70%);
  display: flex; align-items: center; justify-content: center;
  animation: candleFlicker 3s ease-in-out infinite;
}
.sigil-reveal .sigil-circle svg { width: 64px; height: 64px; stroke: var(--gold); fill: none; stroke-width: 1.2; }
.sigil-reveal h3 {
  font-family: var(--font-display); font-size: 28px;
  color: var(--gold); margin-bottom: 12px;
}
.sigil-reveal p {
  font-family: var(--font-display); font-style: italic;
  color: var(--moonlight-muted); font-size: 16px;
  max-width: 280px; margin: 0 auto 32px; line-height: 1.6;
}
.main-shell { overflow: hidden; display: flex; flex-direction: column; }
.main-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-bottom: 16px; }
.app-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 24px 24px 16px;
  position: sticky; top: 0;
  background: linear-gradient(to bottom, var(--navy) 80%, transparent);
  z-index: 10;
}
.app-header .logo {
  font-family: var(--font-display); font-weight: 500;
  font-size: 28px; color: var(--gold);
  letter-spacing: 0.06em; flex: 1; text-align: center;
}
.icon-btn {
  background: none; border: none;
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--gold);
  transition: all 200ms var(--transition);
}

function init() {
  spawnDust();

  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      Object.assign(STATE, parsed);
      STATE.saved = new Set(parsed.saved || []);
      STATE.reactions = parsed.reactions || {};
      Object.keys(STATE.reactions).forEach(k => { STATE.reactions[k] = new Set(STATE.reactions[k] || []); });
      STATE.posts = parsed.posts && parsed.posts.length ? parsed.posts : [...SEED_POSTS];
      STATE.events = parsed.events && parsed.events.length ? parsed.events : [...SEED_EVENTS];
      STATE.students = parsed.students && parsed.students.length ? parsed.students : [...SEED_STUDENTS];
      STATE.conversations = parsed.conversations && Object.keys(parsed.conversations).length ? parsed.conversations : {...SEED_CONVERSATIONS};
      seedReactionCounts();
      if (STATE.user) STATE.screen = 'home';
    } catch(e) { seedFresh(); }
  } else { seedFresh(); }
  render();
}

function setupSupabaseAuth() {
  if (!SUPABASE_READY || !sb) return; // demo mode, nothing to wire

  sb.auth.onAuthStateChange((event, session) => {
    if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session && session.user) {
      const u = session.user;
      const meta = u.user_metadata || {};
      const fullName = meta.full_name || meta.name || (u.email ? u.email.split('@')[0] : 'Student');
      const initials = fullName.split(/\s+/).map(w => w[0] || '').slice(0, 2).join('').toUpperCase() || '?';
      const provider = (u.app_metadata && u.app_metadata.provider) || 'email';

      // If we already have a local profile for this email, just resume it
      const stored = JSON.parse(localStorage.getItem('orbit_state_v3') || '{}');
      if (stored.user && stored.user.email === u.email && stored.user.interests && stored.user.interests.length) {
        STATE.user = stored.user;
        save();
        if (STATE.screen !== 'home') go('home');
        return;
      }

      // New sign-in — build a fresh profile
      STATE.user = {
        name: fullName,
        email: u.email,
        college: inferCollege(u.email),
        year: 'Year 3',
        initials: initials,
        interests: [],
        bio: 'Building things that connect minds. Currently obsessed with cross-college collaboration.',
        isFounder: true,
        isAdmin: isAdminEmail(u.email),
        earnedSigils: ['arrived'],
        stats: { projects: 0, hackathons: 0, collabs: 0 },
        authMethod: provider,
        photoUrl: meta.avatar_url || meta.picture || null
      };
      onboardingData.email = u.email;
      onboardingData.interests = [];
      save();
      STATE.onboardingStep = 0;
      go('onboarding');
    }
  });
}

function setupEasterEggs() {
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    typeBuffer += e.key.toLowerCase();
    if (typeBuffer.length > 20) typeBuffer = typeBuffer.slice(-20);
    if (typeBuffer.endsWith('lumos')) {
      document.body.classList.add('lumos');
      toast('Lumos. ✦');
      setTimeout(() => document.body.classList.remove('lumos'), 2400);
      typeBuffer = '';
    }
    if (typeBuffer.endsWith('nox')) {
      document.body.classList.remove('lumos');
      toast('Nox.');
      typeBuffer = '';
    }
    if (typeBuffer.endsWith('decree')) {
      if (STATE.user) {
        STATE.user.isAdmin = true;
        save(); render();
        toast('By decree, you hold the keys. Admin Panel unlocked.');
      } else {
        toast('Sign in first to claim admin.');
      }
      typeBuffer = '';
    }
    if (typeBuffer.endsWith('abjure')) {
      if (STATE.user && STATE.user.isAdmin) {
        STATE.user.isAdmin = false;
        save(); render();
        toast('Admin role relinquished.');
      }
      typeBuffer = '';
    }
  });
}

function toggleReaction(itemId, reactionType, event) {
  if (event) event.stopPropagation();
  if (!STATE.reactions[itemId]) STATE.reactions[itemId] = new Set();
  if (!STATE.reactionCounts[itemId]) STATE.reactionCounts[itemId] = { sparkle: 0, flame: 0, constellation: 0 };
  const reactionSet = STATE.reactions[itemId];
  if (reactionSet.has(reactionType)) {
    reactionSet.delete(reactionType);
    STATE.reactionCounts[itemId][reactionType] = Math.max(0, (STATE.reactionCounts[itemId][reactionType] || 1) - 1);
  } else {
    reactionSet.add(reactionType);
    STATE.reactionCounts[itemId][reactionType] = (STATE.reactionCounts[itemId][reactionType] || 0) + 1;
  }
  save(); render();
}

function moderateMedia() { return new Promise((resolve) => setTimeout(() => resolve({ safe: true }), 400)); }
function moderateText(text) {
  const banned = ['nude', 'kill yourself', 'porn'];
  const lower = text.toLowerCase();
  return { safe: !banned.some(b => lower.includes(b)) };
}

function createPost(data) {
  const textCheck = moderateText(data.title + ' ' + data.body);
  if (!textCheck.safe) { toast('This post cannot be published.'); return; }
  if (!data.title || !data.body) { toast('Title and story are required'); return; }
  const newPost = {
    id: 'user-' + Date.now(), type: data.type,
    typeLabel: data.type === 'hackathon' ? 'Hackathon' : data.type === 'research' ? 'Research' : 'Side Project',
    author: { name: STATE.user.name, college: STATE.user.college, year: STATE.user.year, initials: STATE.user.initials, photoUrl: STATE.user.photoUrl || null },
    title: data.title, body: data.body, time: 'just now',
    skills: (data.skills || '').split(',').map(s => s.trim()).filter(Boolean).slice(0, 4)
  };
  STATE.posts.unshift(newPost);
  STATE.reactionCounts[newPost.id] = { sparkle: 0, flame: 0, constellation: 0 };
  closeCompose(); save();
  toast('Your letter is now in the feed ✦'); render();
}

async function createEvent(data) {
  if (!data.title || !data.caption) { toast('Title and caption are required'); return; }
  const textCheck = moderateText(data.title + ' ' + data.caption);
  if (!textCheck.safe) { toast('This memory cannot be shared.'); return; }
  if (data.mediaDataUrl) {
    const result = await moderateMedia(data.mediaDataUrl);
    if (!result.safe) { toast('That image cannot be shared.'); return; }
  }
  const newEvent = {
    id: 'user-event-' + Date.now(),
    tag: data.tag || 'Memory', title: data.title,
    author: { name: STATE.user.name, college: STATE.user.college, initials: STATE.user.initials, photoUrl: STATE.user.photoUrl || null },
    location: data.location || STATE.user.college, caption: data.caption,
    image: data.mediaDataUrl ? 'url(' + data.mediaDataUrl + ')' : EVENT_IMAGES.hackathon_night,
    time: 'just now', isVideo: false
  };
  STATE.events.unshift(newEvent);
  STATE.reactionCounts[newEvent.id] = { sparkle: 0, flame: 0, constellation: 0 };
  closeCompose(); save();
  toast('Memory shared ✦'); render();
}

function handleMediaUpload(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    pendingMediaDataUrl = e.target.result;
    const preview = document.getElementById('media-preview');
    if (preview) {
      preview.style.backgroundImage = 'url(' + pendingMediaDataUrl + ')';
      preview.style.display = 'block';
      preview.parentElement.classList.add('has-media');
    }
  };
  reader.readAsDataURL(file);
}

function handleOAuth(provider) {

}

function handleCodeInput(index, ev) {
  const value = ev.target.value.replace(/[^0-9]/g, '');
  ev.target.value = value.slice(-1);
  STATE.verifyCode[index] = ev.target.value;
  if (ev.target.value && index < 5) {
    const next = document.querySelector('.code-digit[data-idx="' + (index + 1) + '"]');
    if (next) next.focus();
  }
  ev.target.classList.toggle('filled', !!ev.target.value);
  if (STATE.verifyCode.every(d => d.length === 1)) {
    setTimeout(() => verifyCodeSubmit(), 200);
  }
}

function handleCodeKeydown(index, ev) {
  if (ev.key === 'Backspace' && !ev.target.value && index > 0) {
    const prev = document.querySelector('.code-digit[data-idx="' + (index - 1) + '"]');
    if (prev) { prev.focus(); prev.value = ''; STATE.verifyCode[index - 1] = ''; prev.classList.remove('filled'); }
  }
}

function handleCodePaste(ev) {
  ev.preventDefault();
  const paste = (ev.clipboardData.getData('text') || '').replace(/[^0-9]/g, '').slice(0, 6);
  if (!paste) return;
  for (let i = 0; i < 6; i++) {
    STATE.verifyCode[i] = paste[i] || '';
    const el = document.querySelector('.code-digit[data-idx="' + i + '"]');
    if (el) { el.value = paste[i] || ''; el.classList.toggle('filled', !!paste[i]); }
  }
  if (paste.length === 6) setTimeout(() => verifyCodeSubmit(), 200);
}

function verifyCodeSubmit() {
  const code = STATE.verifyCode.join('');
  if (code.length !== 6) { toast('Enter all six digits'); return; }
  if (resendInterval) { clearInterval(resendInterval); resendInterval = null; }
  if (STATE.authPath === 'login') {
    const stored = JSON.parse(localStorage.getItem('orbit_state_v3') || '{}');
    if (stored.user) {
      STATE.user = stored.user; save(); go('home');
      setTimeout(() => toast('Welcome back, ' + stored.user.name.split(' ')[0] + ' ✦'), 300);
    } else {
      toast('No account found. Sign up instead?'); go('signup');
    }
  } else {
    onboardingData.email = STATE.pendingEmail;
    STATE.onboardingStep = 0;
    go('onboarding');
  }
}

  const namePart = (onboardingData.email.split('@')[0] || 'Student').replace(/[._\d]+/g, ' ').trim();

    name, email: onboardingData.email,
    college: inferCollege(onboardingData.email),

    + '<button class="reaction-btn ' + (userReactions.has('sparkle') ? 'active' : '') + '" onclick="toggleReaction(\'' + itemId + '\', \'sparkle\', event)"><span class="ico">' + ICONS.sparkle + '</span><span>' + (counts.sparkle || 0) + '</span></button>'

function renderHome() {
  const tab = STATE.feedTab;
  const filtered = tab === 'listings'
    ? (STATE.feedFilter === 'all' ? STATE.posts : STATE.posts.filter(p => p.type === STATE.feedFilter))
    : STATE.events;
  const greeting = STATE.user ? GREETINGS[todayGreetingIndex()] : "Welcome.";
  const prompt = ARCHIVE_PROMPTS[todayPromptIndex()];
  const promptParts = prompt.split(' — ');

  let body = '<header class="app-header">'
    + '<button class="icon-btn" onclick="openCompose()">' + ICONS.quill + '</button>'
    + '<div class="logo">Orbit</div>'
    + '<button class="icon-btn" onclick="openSage()" aria-label="Ask Sage" style="color: var(--gold-bright);">' + ICONS.feather + '</button>'
    + '</header>'
    + '<div class="greeting-card">'
    + '<span class="label">' + promptParts[0] + '</span>'
    + '<div class="greeting-text">' + greeting + '</div>'
    + '<div style="font-family: var(--font-display); font-style: italic; font-size: 14px; color: var(--moonlight-muted); margin-top: 6px; line-height: 1.5;">' + (promptParts[1] || '') + '</div>'
    + '</div>'
    + '<div class="filter-row" style="padding-bottom: 12px;">'
    + '<button class="chip ' + (tab === 'listings' ? 'active' : '') + '" onclick="setFeedTab(\'listings\')">📜 Listings</button>'
    + '<button class="chip ' + (tab === 'events' ? 'active' : '') + '" onclick="setFeedTab(\'events\')">✦ Events</button>'
    + '</div>';

  if (tab === 'listings') {
    body += '<div class="filter-row">'
      + '<button class="chip ' + (STATE.feedFilter === 'all' ? 'active' : '') + '" onclick="setFilter(\'all\')">All</button>'
      + '<button class="chip ' + (STATE.feedFilter === 'hackathon' ? 'active' : '') + '" onclick="setFilter(\'hackathon\')">Hackathons</button>'
      + '<button class="chip ' + (STATE.feedFilter === 'research' ? 'active' : '') + '" onclick="setFilter(\'research\')">Research</button>'
      + '<button class="chip ' + (STATE.feedFilter === 'sideproject' ? 'active' : '') + '" onclick="setFilter(\'sideproject\')">Side Projects</button>'
      + '</div>'
      + '<div class="feed">';
    if (filtered.length) {
      body += filtered.map((p, i) => renderPost(p, i)).join('');
    } else {
      body += '<div class="empty-state">The candles have gone quiet here. Try another filter.</div>';
    }
    body += '</div>';

    body += '<div class="events-feed">';

    } else {
      body += '<div class="empty-state">No memories yet. Share the first one from the + below.</div>';
    }
    body += '</div>';
  }
  return body;
}

function renderConversation() {
  const id = STATE.currentConversation;
  const c = STATE.conversations[id];
  if (!c) { setTimeout(() => go('letters'), 0); return ''; }
  let messages = '';
  if (c.messages.length === 0) {
    messages = '<div class="empty-state" style="margin: auto;">Say hello. A small letter often becomes a long collaboration.</div>';
  } else {
    messages = c.messages.map(m => '<div class="message ' + m.from + '">' + m.text + '</div>').join('');
  }
  return '<div class="convo-header">'
    + '<button class="icon-btn" onclick="go(\'letters\')">' + ICONS.arrowBack + '</button>'
    + '<div class="avatar tap-author" onclick="viewStudent(\'' + (c.student.id || id) + '\')">' + c.student.initials + '</div>'
    + '<div class="identity tap-author" onclick="viewStudent(\'' + (c.student.id || id) + '\')">'
    + '<div class="name">' + c.student.name + '</div>'
    + '<div class="meta">' + c.student.college + ' · ' + (c.student.year || '') + '</div>'
    + '</div></div>'
    + '<div class="convo-messages" id="convo-messages">' + messages + '</div>'
    + '<div class="convo-input">'
    + '<input type="text" id="msg-input" placeholder="Write a letter..." onkeypress="if(event.key===\'Enter\') { sendMessage(this.value); this.value=\'\'; }" />'
    + '<button class="send-btn" onclick="const i=document.getElementById(\'msg-input\'); sendMessage(i.value); i.value=\'\';">' + ICONS.send + '</button>'
    + '</div>';
}

function computeSigils() {
  if (!STATE.user) return [];
  const earned = new Set(STATE.user.earnedSigils || ['arrived']);
  const userPosts = STATE.posts.filter(p => p.author.name === STATE.user.name);
  const userEvents = STATE.events.filter(e => e.author.name === STATE.user.name);
  const hasMessages = Object.values(STATE.conversations).some(c => c.messages.some(m => m.from === 'me'));
  if (hasMessages) earned.add('first_letter');
  if (userPosts.length > 0) earned.add('first_post');
  if (userEvents.length > 0) earned.add('first_event');
  return SIGILS.map(s => Object.assign({}, s, { earned: earned.has(s.id) }));
}

function startEditProfile() {
  if (!STATE.user) return;
  STATE.editDraft = {
    name: STATE.user.name,
    year: STATE.user.year,
    bio: STATE.user.bio,
    initials: STATE.user.initials,
    interests: [...(STATE.user.interests || [])],
    photoUrl: STATE.user.photoUrl || null
  };
  go('editProfile');
}

function avatarStyle(photoUrl) {
  return photoUrl ? 'background-image: url(' + photoUrl + ');' : '';
}

function avatarClass(base, photoUrl) {
  return base + (photoUrl ? ' has-photo' : '');
}

function processProfilePhoto(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const size = 256;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const minDim = Math.min(img.width, img.height);
        const sx = (img.width - minDim) / 2;
        const sy = (img.height - minDim) / 2;
        ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => reject(new Error('Image failed to load'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('File read failed'));
    reader.readAsDataURL(file);
  });
}

async function handleProfilePhotoUpload(input) {
  const file = input.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { toast('Please choose an image'); return; }
  if (file.size > 8 * 1024 * 1024) { toast('Image must be under 8 MB'); return; }
  const wrap = document.querySelector('.edit-avatar-wrap');
  if (wrap) {
    const loading = document.createElement('div');
    loading.className = 'photo-uploading';
    loading.textContent = 'Scanning...';
    wrap.appendChild(loading);
  }
  try {
    const dataUrl = await processProfilePhoto(file);
    const modResult = await moderateMedia(dataUrl);
    if (!modResult.safe) { toast('That image cannot be used.'); render(); return; }
    if (!STATE.editDraft) STATE.editDraft = {};
    STATE.editDraft.photoUrl = dataUrl;
    render();
    toast('Photo updated. Tap Save to keep it.');
  } catch (err) {
    toast('Could not process that image');
    render();
  }
}

  const parts = STATE.editDraft.name.split(/\s+/);

function viewStudentByName(name, ev) {
  if (ev) ev.stopPropagation();
  if (STATE.user && name === STATE.user.name) {
    go('profile'); return;
  }
  // Match against seeded students first, then post authors
  const match = STATE.students.find(s => s.name === name);
  if (match) { viewStudent(match.id); return; }
  // Build a temp student record from a post author
  const post = STATE.posts.find(p => p.author.name === name);
  if (post) {
    const tempId = 'author-' + name.replace(/\s+/g, '-').toLowerCase();
    if (!STATE.students.find(s => s.id === tempId)) {
      STATE.students.push({
        id: tempId, name: post.author.name,
        college: post.author.college, year: post.author.year,
        initials: post.author.initials,
        skills: post.skills || [], quote: post.title,
        match: 70 + Math.floor(Math.random() * 25)
      });
    }
    viewStudent(tempId);
  }
}

const SAGE_GREETING = "Hello. I am Sage — your quiet companion in Orbit.\n\nI can help you find collaborators, draft a listing, refine your bio, or answer questions about how this place works. What shall we do?";

function openSage() {
  STATE.sageOpen = true;
  if (STATE.sageMessages.length === 0) {
    STATE.sageMessages = [{ from: 'sage', text: SAGE_GREETING }];
  }
  render();
  setTimeout(() => {
    const input = document.getElementById('sage-input');
    if (input) input.focus();
  }, 350);
}

function closeSage() {
  STATE.sageOpen = false;
  render();
}

function sendSageSuggestion(text) {
  const input = document.getElementById('sage-input');
  if (input) input.value = text;
  sendSageMessage(text);
}

async function sendSageMessage(text) {
  const value = (text || (document.getElementById('sage-input') || {}).value || '').trim();
  if (!value) return;
  const input = document.getElementById('sage-input');
  if (input) input.value = '';
  STATE.sageMessages.push({ from: 'user', text: value });
  STATE.sageThinking = true;
  render();
  scrollSageBottom();

  let reply = null;
  try { reply = await callClaudeAPI(value); }
  catch (err) { reply = null; }
  if (!reply) reply = mockSageReply(value);

  STATE.sageThinking = false;
  STATE.sageMessages.push({ from: 'sage', text: reply });
  render();
  scrollSageBottom();
}

function scrollSageBottom() {
  setTimeout(() => {
    const msgs = document.querySelector('.sage-messages');
    if (msgs) msgs.scrollTop = msgs.scrollHeight;
  }, 80);
}

function buildSageSystemPrompt() {
  const u = STATE.user || { name: 'Student', college: 'Unknown', interests: [] };
  const studentList = STATE.students.slice(0, 8).map(s =>
    '- ' + s.name + ' (' + s.college + ', ' + s.year + '): ' + s.skills.join(', ') + ' — "' + s.quote + '"'
  ).join('\n');
  const recentPosts = STATE.posts.slice(0, 6).map(p =>
    '- ' + p.author.name + ' (' + p.author.college + '): "' + p.title + '" [' + p.typeLabel + ']'
  ).join('\n');
  return 'You are Sage, Orbit\'s quiet AI companion. Orbit is a cross-college collaboration platform for Indian students who want to find teammates for hackathons, side projects, and research.\n\n'
    + 'Current user: ' + u.name + ' from ' + u.college + ', interested in ' + ((u.interests || []).join(', ') || 'various things') + '.\n\n'
    + 'Students currently on the platform:\n' + studentList + '\n\n'
    + 'Recent listings on the feed:\n' + recentPosts + '\n\n'
    + 'Your job: help the user find collaborators (suggest specific people by name from the list above), draft posts, refine their bio, or answer questions about Orbit.\n\n'
    + 'Tone: warm, brief, slightly literary — like a thoughtful librarian. Keep responses under 4 sentences unless they explicitly ask you to draft something longer. Never preachy. Never use emojis except ✦ sparingly. When suggesting people, mention their names clearly.';
}

async function callClaudeAPI(userMessage) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 600,
      system: buildSageSystemPrompt(),
      messages: STATE.sageMessages.slice(-8).map(m => ({
        role: m.from === 'user' ? 'user' : 'assistant',
        content: m.text
      })).concat([{ role: 'user', content: userMessage }])
    })
  });
  if (!response.ok) throw new Error('API failed');
  const data = await response.json();
  if (!data.content) throw new Error('No content');
  return data.content.map(c => c.text || '').filter(Boolean).join('\n');
}

function mockSageReply(query) {
  const q = query.toLowerCase().trim();
  const u = STATE.user;

  // Greetings
  if (/^(hi|hello|hey|hii+|sup|yo)\b/.test(q) && q.length < 20) {
    return "Hello. What shall we work on?";
  }

  // Affirmations
  if (/^(yes|yeah|yep|sure|ok+|okay|please|y)\.?$/.test(q) || /^(yes|sure|ok),?\s+(please|do it|go ahead)/.test(q)) {
    const last = STATE.sageMessages.length > 1 ? STATE.sageMessages[STATE.sageMessages.length - 2] : null;
    if (last && /draft/i.test(last.text || '')) {
      return "Tell me one line about the project — what you're building and what you need — and I'll write a listing for you.";
    }
    if (last && /collaborat|message/i.test(last.text || '')) {
      return "Which one of them caught your eye? I can sketch a first letter.";
    }
    return "Got it. Tell me a bit more — what's the project, or what kind of help do you want?";
  }

  // Negation
  if (/^(no|nope|not really|nah)\.?$/.test(q)) {
    return "Fair. Whenever you're ready.";
  }

  // Thanks
  if (/^(thanks|thank you|thx|ty)\b/.test(q) && q.length < 25) {
    return "Happy to help. ✦";
  }

  // "Last one", "one more", "another", "tell me more"
  if (/(last one|one more|another|tell me more|continue|more)\b/.test(q) && q.length < 25) {
    return "Sure — about what? A collaborator for a specific topic, a listing for a project, or your bio?";
  }

  // Very short ambiguous queries
  if (q.split(/\s+/).length <= 2 && !/(ml|ai|cv|nlp|design|frontend|backend|hackathon|bio|orbit)/.test(q)) {
    return "Could you say a bit more? A few words about what you're working on helps me point you somewhere useful.";
  }

  const topicMap = {
    'ml': ['Arjun Menon', 'Sahil Khan'], 'machine learning': ['Arjun Menon', 'Sahil Khan'],
    'ai': ['Arjun Menon', 'Sahil Khan'], 'cv': ['Arjun Menon'], 'computer vision': ['Arjun Menon'],
    'nlp': ['Sahil Khan'], 'tamil': ['Sahil Khan'], 'language': ['Sahil Khan'],
    'design': ['Kavya Gupta', 'Riya Joshi'], 'ui': ['Kavya Gupta'], 'ux': ['Kavya Gupta'],
    'frontend': ['Neha Banerjee', 'Riya Joshi'], 'react': ['Neha Banerjee'], 'web': ['Neha Banerjee'],
    'three.js': ['Neha Banerjee'], 'shader': ['Neha Banerjee'],
    'backend': ['Ishaan Kapoor'], 'rust': ['Ishaan Kapoor'], 'distributed': ['Ishaan Kapoor'],
    'biotech': ['Tanvi Bhat'], 'genomics': ['Tanvi Bhat'], 'bioinformatics': ['Tanvi Bhat'],
    'robot': ['Aditya Rao'], 'hardware': ['Aditya Rao'], 'embedded': ['Aditya Rao'],
    'product': ['Riya Joshi'], 'strategy': ['Riya Joshi'],
    'accessibility': ['Kavya Gupta'], 'a11y': ['Kavya Gupta'],
    'paper': ['Tanvi Bhat', 'Arjun Menon'], 'research': ['Tanvi Bhat', 'Arjun Menon']
  };

  if (/(find|need|looking for|who|suggest).*(collaborat|teammate|partner|person|someone|people|engineer|developer|designer|coder)/i.test(q)
      || /(who should i message|who is good at|recommend)/i.test(q)) {
    let matches = [];
    Object.keys(topicMap).forEach(k => { if (q.indexOf(k) > -1) matches = matches.concat(topicMap[k]); });
    matches = [...new Set(matches)];
    if (matches.length === 0) {
      return "Tell me what you're working on — a hackathon, side project, or research idea — and I'll pick two or three people from the Map who'd fit. Skills, language, or domain — any of it helps.";
    }
    const reply = matches.slice(0, 3).map(name => {
      const s = STATE.students.find(x => x.name === name);
      return s ? '\n• **' + s.name + '** — ' + s.skills.join(', ') + '. "' + s.quote + '"' : '';
    }).filter(Boolean).join('');
    return 'Three names worth a letter:' + reply + '\n\nWant me to draft a message for one of them?';
  }

  if (/(draft|write|help me with|compose).*(listing|post|message|letter)/i.test(q)
      || /(how do i (write|post|draft))/i.test(q)) {
    const college = (u && u.college) || 'your college';
    return 'Here\'s a template you can edit:\n\n**Title:** [The one-line ask. e.g. "Looking for a designer for a Tamil mental health app"]\n\n**Story:** I\'m a [year] student at ' + college + ', building [the thing]. I have [what is already done] and need [the missing piece — skills + commitment + timeline].\n\n**Skills needed:** [comma-separated — 3 or 4 max]\n\nKeep it under 60 words. Be specific about what is done and what is missing — people commit when they can see the shape of the work. Want me to draft one for a specific project?';
  }

  if (/(bio|profile|about me|describe myself)/i.test(q)) {
    const interests = (u && u.interests) ? u.interests.join(', ') : 'building things';
    return 'A strong bio answers three things in one sentence each: what you build, what you\'re currently obsessed with, and what you\'d want help with. Try this shape:\n\n"I\'m a [year] AIML student at ' + ((u && u.college) || 'my college') + ', working on [current project]. Currently learning [skill]. Open to [type of collab]."\n\nYour interests (' + interests + ') give me material — want me to write a draft using them?';
  }

  if (/(what is|what's) orbit/i.test(q) || /(how does .*work)/i.test(q) || (/(help|explain)/i.test(q) && q.length < 30)) {
    return "Orbit is a place for Indian students to find each other across colleges — for hackathons, side projects, research. Three things you can do:\n\n• **Feed** — post a listing when you need teammates, browse memories from other builders\n• **Map** — see students matched to your interests, send them a letter\n• **Letters** — keep the conversations going\n\nThe goal is for serious builders to stop being stuck at their own campus.";
  }

  if (/(brainstorm|idea|project idea|what should i build|stuck)/i.test(q)) {
    const interests = (u && u.interests && u.interests.length) ? u.interests.join(', ') : 'AI, design, web';
    return 'Three threads to pull on, based on what you care about (' + interests + '):\n\n1. **Vernacular tools** — most LLMs still struggle with Indian languages. Even small wins (a better Tamil tokenizer, a Hindi-first form builder) get noticed.\n\n2. **Student-life infrastructure** — the unglamorous problems your hostel, mess, or department actually has. People undervalue these. They ship.\n\n3. **Cross-college portfolios** — a tiny thing that solves one annoying coordination problem you have personally. The best projects start from your own pain.\n\nPick one and I\'ll help you write the first listing.';
  }

  if (/(hackathon|event|competition|smart india|sih|et ai|flipkart|grid)/i.test(q)) {
    return "Live ones I'd watch this month: **ET AI Hackathon 2.0** (registration closes May 31, ₹10L prize pool), **Flipkart Grid 6.0** software track, and **Google Gen AI Academy** if you want Gemini API work. Smart India Hackathon registrations open later — track that on the SIH portal.\n\nWant help forming a team for one of these?";
  }

  // Rotating fallbacks so Sage doesn't repeat itself
  const fallbacks = [
    "Try one of these for a start — \"find me an ML person\", \"draft a listing\", or \"refine my bio\". Or describe what you're working on and I'll figure out the rest.",
    "I work best with a bit of context. What are you building, or what do you need from Orbit right now?",
    "I'm a quiet companion, not a search engine — so tell me the shape of the thing. A project? A teammate? A draft?"
  ];
  const recentTexts = STATE.sageMessages.slice(-4).map(m => m.text || '').join(' ');
  let pick = fallbacks.find(f => !recentTexts.includes(f.slice(0, 30)));
  return pick || fallbacks[Math.floor(Math.random() * fallbacks.length)];
}
